<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Web-Grocer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;--bk:#0A0A0A;--ch:#1a1a1a;--c2:#272727;--or:#FF6B00;--tx:#f2efe9;--mu:rgba(242,239,233,.58)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bk);color:var(--tx);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button,input{font-family:inherit}
#hud{position:fixed;inset:0;pointer-events:none}
.glass{background:rgba(14,14,14,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:18px;color:var(--tx)}
#top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;padding:11px 16px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px}
#top small{color:var(--mu);font-weight:400;text-align:right}
#ret{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.55)}
#joy{display:none;position:absolute;left:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;pointer-events:auto;touch-action:none;background:rgba(14,14,14,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);z-index:2}
.touch #joy{display:block}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:var(--or);box-shadow:0 0 16px rgba(255,107,0,.6);transform:translate(-50%,-50%)}
#basket{position:absolute;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));width:min(68vw,300px);transform:translate(-50%,120%);transition:transform .95s cubic-bezier(.2,1.25,.4,1);pointer-events:none}
#basket.up{transform:translate(-50%,0)}
#basket svg{display:block;width:100%;height:auto}
#bd{position:absolute;left:50%;top:44px;min-width:34px;height:34px;padding:0 9px;margin-left:-17px;border-radius:17px;background:var(--or);color:#0A0A0A;font-weight:700;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:auto;cursor:pointer}
#pick{position:absolute;display:none;align-items:center;gap:12px;padding:8px 8px 8px 16px;pointer-events:auto;transform:translate(-50%,-112%);max-width:92vw}
#pick.on{display:flex;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;scale:.7}}
#pick b{display:block;font-size:14px}#pick small{color:var(--mu);font-size:12px}
.add{width:46px;height:46px;border:0;border-radius:50%;background:var(--or);color:#0A0A0A;font:700 28px/1 Sora,sans-serif;box-shadow:0 0 18px rgba(255,107,0,.6);cursor:pointer}
.add:active{transform:scale(.9)}
.step{display:flex;align-items:center;gap:10px;background:var(--c2);border-radius:14px;padding:4px;font-weight:600}
.step span{min-width:18px;text-align:center}
.step button{width:34px;height:34px;border-radius:10px;border:0;background:var(--or);color:#0A0A0A;font:700 20px/1 Sora,sans-serif;cursor:pointer}
.fly{position:fixed;z-index:9;width:18px;height:18px;border-radius:50%;pointer-events:none;border:2px solid #fff}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:rgba(10,10,10,.94);border-top:1px solid rgba(255,107,0,.28);transform:translateY(101%);transition:transform .8s cubic-bezier(.2,.9,.25,1)}
#tabs.in{transform:none}
#tabs button{flex:1;position:relative;background:none;border:0;color:var(--mu);font:600 11px Sora,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--or)}
#tabs button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--or);box-shadow:0 0 12px var(--or)}
#tb{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--or);color:#0A0A0A;font-size:10px;display:none;place-items:center;padding:0 4px}
.page{position:fixed;inset:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:3;background:var(--bk);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 28px;display:none}
.page.on{display:block}
h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 16px}h2{font-size:20px;margin:4px 0 14px}
.card{background:var(--ch);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.grow small,.card small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.thumb{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--or);color:#0A0A0A;font:600 15px Sora,sans-serif;padding:15px 18px;cursor:pointer;box-shadow:0 0 22px rgba(255,107,0,.28)}
.btn:disabled{opacity:.5}.btn.g{background:var(--c2);color:var(--tx);box-shadow:none;margin-top:10px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;color:var(--mu)}.sum .t{color:var(--tx);font-weight:700;font-size:17px;border-top:1px solid rgba(255,255,255,.1);margin-top:6px;padding-top:11px}
.empty{text-align:center;padding:36px 20px;color:var(--mu)}.empty .btn{margin-top:18px}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:9px;background:var(--c2);color:var(--mu)}.chip.o{background:rgba(255,107,0,.18);color:var(--or)}
.det{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}.open .det{display:block}
.det .l{display:flex;justify-content:space-between;padding:3px 0}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
input{width:100%;background:var(--c2);border:1px solid transparent;border-radius:12px;color:var(--tx);font-size:15px;padding:13px 14px;outline:none}
input:focus{border-color:var(--or)}
.av{width:68px;height:68px;border-radius:50%;background:var(--or);color:#0A0A0A;font:700 28px Sora,sans-serif;display:grid;place-items:center;box-shadow:0 0 24px rgba(255,107,0,.4)}
.pm{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--c2);margin-top:8px;border:1.5px solid transparent;cursor:pointer}
.pm.on{border-color:var(--or)}.pm i{width:18px;height:18px;border-radius:50%;border:2px solid var(--mu)}.pm.on i{border-color:var(--or);background:radial-gradient(var(--or) 45%,transparent 50%)}
#sheet{position:fixed;inset:0;z-index:7;visibility:hidden}#sheet.on{visibility:visible}
.sb{position:absolute;inset:0;background:rgba(0,0,0,.65);opacity:0;transition:opacity .3s}#sheet.on .sb{opacity:1}
.sp{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:#141414;border-radius:26px 26px 0 0;border-top:1px solid rgba(255,107,0,.45);padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.25,1)}#sheet.on .sp{transform:none}
.ok{text-align:center;padding:10px 0}.ok svg{width:96px;height:96px;fill:none;stroke:var(--or);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ok circle{stroke-dasharray:190;stroke-dashoffset:190;animation:dr .7s ease forwards}.ok path{stroke-dasharray:50;stroke-dashoffset:50;animation:dr .4s .6s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:9;padding:11px 18px;font-size:14px;font-weight:600;transition:.3s;pointer-events:none;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:10;background:var(--bk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#splash svg path,#splash svg circle{fill:none;stroke:var(--or);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:dr 1.3s .1s ease forwards}
#logo{font-size:clamp(34px,10vw,52px);font-weight:700;letter-spacing:-.02em;display:flex}
#logo span{display:inline-block;opacity:0;transform:translateY(24px);animation:rise .6s cubic-bezier(.2,.9,.3,1.2) forwards}#logo .h{color:var(--or);text-shadow:0 0 22px var(--or)}
@keyframes rise{to{opacity:1;transform:none}}
#tag,#go,#help{opacity:0;animation:rise .6s forwards}#tag{font-size:15px;color:var(--mu);animation-delay:1.5s}#help{font-size:12.5px;color:var(--mu);max-width:290px;line-height:1.5;animation-delay:2.2s}
#go{width:auto;padding:15px 40px;border-radius:999px;animation-delay:1.9s}
#iris{position:fixed;inset:0;z-index:11;background:var(--or);display:none;clip-path:circle(0 at 50% 50%)}
.door{position:fixed;top:0;bottom:0;width:50%;overflow:hidden;background:var(--or);z-index:12;display:none}
#dl{left:0}#dr{right:0}.door.on{display:block}
.dw{position:absolute;top:0;bottom:0;left:0;width:100vw;display:flex;align-items:center;justify-content:center}#dr .dw{left:-50vw}
.dc{display:flex;flex-direction:column;align-items:center;gap:12px;color:#0A0A0A;text-align:center;animation:dpop .75s cubic-bezier(.2,1.2,.4,1) both}
@keyframes dpop{from{opacity:0;transform:scale(.8)}}
.dc svg path,.dc svg circle{fill:none;stroke:#0A0A0A;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:dr .9s .1s ease forwards}
.dc b{font-size:clamp(34px,10vw,52px);letter-spacing:-.02em}.dc i{font-style:normal;color:#fff}.dc small{font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

function rSheet(){const T=totals(),P=S.prof,ad=P.addr?[P.name,P.addr,[P.city,P.pin].filter(Boolean).join(' ')].filter(Boolean).join(', '):'';let h;
 if(step==='done')h='<div class="ok"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30"/><path d="M38 51l9 9 17-19"/></svg><h2>Order placed</h2><small style="color:var(--mu)">#'+S.orders[0].id+' · '+inr(S.orders[0].total)+'</small></div><button class="btn" style="margin-top:18px" data-a="vo">View order</button><button class="btn g" data-a="shop">Keep shopping</button>';
 else h='<h2>Payment</h2><div class="card"><small>Deliver to</small>'+(ad?'<div style="margin-top:4px">'+ad+'</div>':'<div style="margin-top:4px;color:var(--or)">Add a delivery address to continue.</div><button class="btn g" data-a="toprof">Go to profile</button>')+'</div><div class="card"><small>Pay with</small>'+['UPI','Card','Cash on delivery'].map(m=>'<div class="pm'+(S.pay===m?' on':'')+'" data-a="pm" data-m="'+m+'"><i></i>'+m+'</div>').join('')+'</div><div class="card sum"><div><span>Items</span><span>'+inr(T.s)+'</span></div><div><span>Delivery</span><span>'+(T.d?inr(T.d):'Free')+'</span></div><div class="t"><span>To pay</span><span>'+inr(T.t)+'</span></div></div><button class="btn" data-a="dopay"'+(!ad||step==='busy'?' disabled':'')+'>'+(step==='busy'?'Processing…':'Pay '+inr(T.t))+'</button><button class="btn g" data-a="cl">Back to cart</button>';
 $('sp').innerHTML=h}
function doPay(){step='busy';rSheet();setTimeout(()=>{const T=totals(),P=S.prof;if(!S.orders)S.orders=seed0();const items=Object.keys(S.cart).map(k=>[k,S.cart[k],BYN[k].price,BYN[k].unit]);
 S.orders.unshift({id:'WG'+(1040+S.orders.length),date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),status:'Packed',pay:S.pay,addr:[P.name,P.addr,P.city,P.pin].filter(Boolean).join(', '),total:T.t,del:T.d,items:items});S.cart={};save();badges();step='done';rSheet();rCart()},1300)}

// ---------- opening credits to store ----------
const dh='<div class="dc"><svg width="70" height="62" viewBox="0 0 86 76"><path d="M4 6h12l9 42h42l9-30H20"/><circle cx="32" cy="63" r="5"/><circle cx="62" cy="63" r="5"/></svg><b>Web<i>-</i>Grocer</b><small>Welcome in. Your cart is ready.</small></div>';
$('dl').innerHTML='<div class="dw">'+dh+'</div>';$('dr').innerHTML='<div class="dw">'+dh+'</div>';
function enter(){const b=$('go').getBoundingClientRect(),X=b.left+b.width/2,Y=b.top+b.height/2,ir=$('iris');ir.style.display='block';
 ir.animate([{clipPath:'circle(0px at '+X+'px '+Y+'px)'},{clipPath:'circle('+Math.hypot(innerWidth,innerHeight)+'px at '+X+'px '+Y+'px)'}],{duration:700,easing:'cubic-bezier(.6,0,.3,1)',fill:'forwards'});
 setTimeout(()=>{$('splash').style.display='none';$('dl').classList.add('on');$('dr').classList.add('on')},700);
 setTimeout(()=>{ir.style.display='none';$('dl').animate([{transform:'none'},{transform:'translateX(-101%)'}],{duration:1000,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});$('dr').animate([{transform:'none'},{transform:'translateX(101%)'}],{duration:1000,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});
  started=true;intro=true;doorT0=performance.now()+500;$('tabs').classList.add('in');$('basket').classList.add('up');toast('Cart picked up. Walk in and point at items.');
  setTimeout(()=>{$('dl').remove();$('dr').remove();ir.remove()},1200)},1900)}
badges();
const ready=Promise.race([document.fonts?document.fonts.load('700 40px Sora'):0,new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).then(()=>{build();loop()});
$('go').addEventListener('click',()=>{$('go').disabled=true;tryLock();ready.then(enter)});
})();
